<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Student Scholarship Monitoring and Academic Compliance System">
<title>Scholarship Monitoring</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="topbar" hidden>
  <h1>Scholarship Monitoring</h1>
  <span id="who"></span>
  <button id="btn-logout">Log out</button>
</header>
<main>
  <div id="msg" role="status"></div>

  <section id="login" class="card auth">
    <h2>Sign in</h2>
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button id="btn-login">Log in</button>
    <p class="switch">No account? <a href="#" id="go-register">Register as Scholar</a></p>
  </section>

  <section id="register" class="card auth" hidden>
    <h2>Register as Scholar</h2>
    <input id="reg-email" type="email" placeholder="Email" autocomplete="email">
    <input id="reg-password" type="password" placeholder="Password (min 6 chars)" autocomplete="new-password">
    <input id="reg-sid" placeholder="Student ID">
    <input id="reg-name" placeholder="Full name">
    <button id="btn-signup">Create account</button>
    <p class="switch">Already registered? <a href="#" id="go-login">Back to log in</a></p>
  </section>

  <section id="scholar" hidden>
    <div class="card">
      <h2>Submit grades <small id="sch-program"></small></h2>
      <div id="notice" class="notice" hidden></div>
      <form id="sub-form" class="grid">
        <label>Academic year<input name="academic_year" value="2026-2027" required></label>
        <label>Semester<select name="semester"><option>1</option><option>2</option></select></label>
        <label>GWA (1.00–5.00)<input name="gwa" type="number" step="0.01" min="1" max="5" required></label>
        <label>Units<input name="units" type="number" min="0" required></label>
        <label>Failed<input name="failed_count" type="number" min="0" value="0" required></label>
        <label>INC<input name="incomplete_count" type="number" min="0" value="0" required></label>
        <label>Dropped<input name="dropped_count" type="number" min="0" value="0" required></label>
        <label>Grade-document ref (required)<input name="evidence_ref" required></label>
        <button id="btn-submit">Submit</button>
      </form>
    </div>
    <div class="card"><h2>My submissions</h2><div id="my-subs"></div></div>
  </section>

  <section id="staff" hidden>
    <div class="card">
      <h2>Dashboard</h2>
      <div class="row">
        <input id="f-ay" value="2026-2027" aria-label="Academic year">
        <select id="f-sem"><option>1</option><option>2</option></select>
        <button id="btn-refresh">Refresh</button>
      </div>
      <div id="totals" class="totals"></div>
    </div>
    <div class="card">
      <h2>Register / assign scholar</h2>
      <form id="reg-form" class="row">
        <input name="email" type="email" placeholder="Scholar auth email" required>
        <input name="student_id" placeholder="Student ID" required>
        <input name="full_name" placeholder="Full name" required>
        <select name="program" id="reg-program"></select>
        <button>Register</button>
      </form>
    </div>
    <div class="card">
      <h2>Registered scholars</h2>
      <div id="scholars"></div>
    </div>
    <div class="card">
      <h2>Submissions</h2>
      <div class="row">
        <input id="q" placeholder="Search student ID / name">
        <select id="f-prog"><option value="">All programs</option></select>
        <select id="f-comp"><option value="">All compliance</option><option>Not Evaluated</option><option>Compliant</option><option>With Deficiency</option></select>
      </div>
      <div id="staff-subs"></div>
    </div>
    <div class="card" id="detail" hidden></div>
  </section>
</main>
<script src="config.js?v=3"></script>
<script type="module" src="app.js"></script>
</body>
</html>
